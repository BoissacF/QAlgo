<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="QAlgo">
  <title>QAlgo</title>
  <!-- Sphère de Bloch stylisée. Dessinée pour rester lisible à 16 px :
       une boule, l'équateur vu en perspective, l'axe z, et le vecteur d'état.
       Les couleurs sont celles de l'application : le bleu des qubits
       rgb(100,100,255) et l'orange des portes rgb(244,102,27). -->
  <circle cx="16" cy="16" r="13" fill="#6464ff"/>
  <!-- axe z -->
  <line x1="16" y1="2.5" x2="16" y2="29.5" stroke="#ffffff" stroke-width="1.1"
        stroke-opacity="0.38"/>
  <!-- équateur -->
  <ellipse cx="16" cy="16" rx="12.6" ry="4.4" fill="none" stroke="#ffffff"
           stroke-width="1.7" stroke-opacity="0.62"/>
  <!-- vecteur d'état -->
  <line x1="16" y1="16" x2="23.6" y2="8.4" stroke="#ffffff" stroke-width="2.7"
        stroke-linecap="round"/>
  <circle cx="23.9" cy="8.1" r="3" fill="#f4661b"/>
</svg>
